server:
  port: ${PORT:8080}
  servlet:
    context-path: /hotel-booking

spring:
  application:
    name: hotel-booking-system

  profiles:
    active: dev

  security:
    user:
      name: admin
      password: 12345678

  datasource:
    driver-class-name: "com.mysql.cj.jdbc.Driver"
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      connection-timeout: 20000
      maximum-pool-size: 10

  jpa:
    show-sql: true
    database-platform: org.hibernate.dialect.MySQLDialect

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 20000
          timeout: 20000
          writetimeout: 20000

  ai:
    # Check xem có model nào - GET https://generativelanguage.googleapis.com/v1beta/models?key=API_KEY
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        base-url: https://generativelanguage.googleapis.com
        completions-path: /v1beta/openai/chat/completions
        options:
          model: models/gemini-2.5-flash
    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: always
            platform: mysql

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 50MB

logging:
  level:
    org.springframework.mail: DEBUG
    jakarta.mail: DEBUG

vnpay:
  # Test: https://sandbox.vnpayment.vn/apis/vnpay-demo/
  tmnCode: ${VNPAY_TMN_CODE}
  hashSecret: ${VNPAY_HASH_SECRET}
  payUrl: https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
  returnUrl: ${VNPAY_RETURN_URL}

jwt:
  signerKey: ${JWT_SECRET}
  valid-duration: 36000 # Thời hạn token (giây)
  refreshable-duration: 360000 # Khoảng thời gian có thể refresh token (giây)

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}

#https://console.cloud.google.com/auth/clients/214116094126-5fegm1lakejj3nmg0ifap3egg6diu4e6.apps.googleusercontent.com?project=gen-lang-client-0931308108
google:
  client-id: ${GOOGLE_CLIENT_ID}