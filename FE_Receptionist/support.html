  <!-- ======= Header ======= -->
  <header id="header" class="header fixed-top d-flex align-items-center">

    <div class="d-flex align-items-center justify-content-between">
      <a href="index.html" class="logo d-flex align-items-center">
        <span class="d-none d-lg-block">Azure Hotel</span>
      </a>
      <i class="bi bi-list toggle-sidebar-btn"></i>
    </div><!-- End Logo -->

    <nav class="header-nav ms-auto">
      <ul class="d-flex align-items-center">

          <a class="nav-link nav-profile d-flex align-items-center pe-0" href="#" data-bs-toggle="dropdown">
            <img src="assets/img/avt-profile.jpg" alt="Profile" class="rounded-circle">
            <span class="d-none d-md-block dropdown-toggle ps-2">Lễ tân</span>
          </a><!-- End Profile Iamge Icon -->
          <ul class="dropdown-menu dropdown-menu-end dropdown-menu-arrow profile">
            <li>
              <a id="logout-btn" class="dropdown-item d-flex align-items-center" href="#">
                <i class="bi bi-box-arrow-right"></i>
                <span>Đăng xuất</span>
              </a>
            </li>
          </ul><!-- End Profile Dropdown Items -->
        </li><!-- End Profile Nav -->

      </ul>
    </nav><!-- End Icons Navigation -->

  </header><!-- End Header -->

  <!-- ======= Sidebar ======= -->
  <aside id="sidebar" class="sidebar">

    <ul class="sidebar-nav" id="sidebar-nav">

      <li class="nav-item">
        <a class="nav-link collapsed" href="rooms.html">
          <i class="bi bi-door-open"></i>

        </a>
      </li><!-- End Room Nav -->

      <li class="nav-item">
        <a class="nav-link collapsed" href="bookings.html">
          <i class="bi bi-clipboard-check"></i>
          <span>Đặt phòng</span>
        </a>
      </li><!-- End Booking Nav -->

      <li class="nav-item">
        <a class="nav-link " href="support.html">
          <i class="bi bi-chat-dots"></i>
          <span>Hỗ trợ</span>
        </a>
      </li><!-- End Support Nav -->

    </ul>

  </aside><!-- End Sidebar-->

  <main id="main" class="main">

    <div class="pagetitle">
      <h1>Danh sách yêu cầu hỗ trợ</h1>
    </div><!-- End Page Title -->

    <section class="section">
      <div class="card shadow-lg" style="height: 580px; min-height: 500px;">
        <div class="row g-0 h-100">
          
          <div class="col-md-4 border-end d-flex flex-column h-100 bg-white rounded-start">
            <div class="p-3 border-bottom bg-light">
              <h5 class="mb-0 fw-bold"><i class="bi bi-inboxes text-primary me-2"></i>Hộp thư đến</h5>
            </div>
            
            <div id="conversationList" class="flex-grow-1 overflow-auto">
              <div class="text-center text-muted mt-4"><div class="spinner-border spinner-border-sm text-primary"></div> Đang tải...</div>
            </div>
          </div>

          <div class="col-md-8 d-flex flex-column h-100 bg-white rounded-end relative">
            
            <div id="welcomeScreen" class="flex-grow-1 d-flex flex-column align-items-center justify-content-center text-muted h-100">
              <i class="bi bi-chat-square-dots display-1 text-light mb-3"></i>
              <h5>Chọn một cuộc hội thoại để bắt đầu hỗ trợ</h5>
            </div>

            <div id="chatArea" class="d-none flex-grow-1 d-flex flex-column h-100">
              
              <div class="p-3 border-bottom d-flex justify-content-between align-items-center bg-light">
                <div>
                  <h6 class="mb-0 fw-bold" id="chatHeaderTitle">Khách hàng...</h6>
                  <small class="text-muted" id="chatHeaderStatus">Đang tải...</small>
                </div>
                <div>
                  <button id="closeTicketBtn" class="btn btn-outline-danger btn-sm rounded-3" onclick="closeConversation()">
                    <i class="bi bi-check-circle me-1"></i>Kết thúc hỗ trợ
                  </button>
                </div>
              </div>

              <div id="chatBox" class="flex-grow-1 p-3 overflow-auto" style="background-color: #f8f9fa;">
                </div>

              <div id="chatInputArea" class="p-3 border-top bg-white">
                <div class="input-group">
                  <input type="text" id="messageInput" class="form-control" placeholder="Nhập câu trả lời..." onkeypress="handleEnter(event)">
                  <button class="btn btn-primary px-4" onclick="sendMessage()">
                    <i class="bi bi-send-fill"></i> Gửi
                  </button>
                </div>
              </div>
            </div>

          </div>
        </div>
      </div>
    </section>

    <!-- <section class="section">

  <!-- Custom JS -->
